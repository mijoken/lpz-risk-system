name: LPZ Phase 2L-C IMERG Independent Confirmation Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_C_IMERG_CONFIRMATION_PILOT_TRIGGER.txt"

permissions:
  contents: read
  actions: read

jobs:
  imerg-confirmation-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify Earthdata secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Download frozen CMORPH candidate reservoir
        uses: actions/download-artifact@v4
        with:
          name: phase2l-cmorph-candidate-reservoir-34469303188
          path: work/reservoir
          repository: ${{ github.repository }}
          run-id: 34469303188
          github-token: ${{ github.token }}
      - name: Run fixed four-day IMERG independent-confirmation pilot
        run: |
          python scripts/phase2l_imerg_independent_confirmation_pilot.py \
            --reservoir work/reservoir/phase2l_cmorph_candidate_reservoir.csv \
            --output-dir reports/historical/phase2l_imerg_confirmation_pilot
      - name: Assert strict guardrails
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_imerg_confirmation_pilot/phase2l_imerg_independent_confirmation_pilot.json',encoding='utf-8'))
          assert p['gate']=='PASS_IMERG_INDEPENDENT_CONFIRMATION_PILOT', p
          assert p['pilot_date_count']==4, p
          assert p['cmorph_selected_candidates'] is True
          assert p['imerg_used_for_candidate_selection'] is False
          assert p['imerg_role']=='INDEPENDENT_SOURCE_NATIVE_CONFIRMATION_ONLY'
          assert p['source_fusion_used'] is False
          assert p['hard_negative_label'] is None
          assert p['environment_variables_used'] is False
          assert p['gsmap_used_for_discovery'] is False
          assert p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False
          assert p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2l-imerg-independent-confirmation-pilot-${{ github.run_id }}
          path: reports/historical/phase2l_imerg_confirmation_pilot
          if-no-files-found: error
          retention-days: 90
