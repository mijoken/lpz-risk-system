name: LPZ Prospective Self-Healing Batch Collector

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is only a wake-up signal; slot time is deterministic UTC 15-minute grid.
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    # Redundant GitHub-only wake-up path independent of this workflow's own cron.
    workflows: ["LPZ Public Production Cycle (O6)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/prospective-feature-collector.yml"
      - "scripts/o8_1_self_healing_batch_collector.py"
      - "scripts/o8_1_slot_replay_proof.py"
      - "scripts/build_prospective_feature_bundle.py"
      - "scripts/radar_*.py"
      - "scripts/build_parent_precursor_report.py"
      - "src/lpz_risk/**"
      - "tests/test_o8_1_self_healing_batch.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: lpz-prospective-self-healing-batch
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify ecCodes runtime
        run: python -m eccodes selfcheck

      - name: Run O8.1 collector unit tests
        run: python -m pytest -q tests/test_o8_1_self_healing_batch.py

      - name: Download recent lightweight batch indexes
        shell: bash
        run: |
          mkdir -p incoming/indexes
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow prospective-feature-collector.yml \
            --limit 30 \
            --json databaseId,conclusion,status \
            > /tmp/o81-runs.json
          python - <<'PY' > /tmp/o81-run-ids.txt
          import json
          rows=json.load(open('/tmp/o81-runs.json',encoding='utf-8'))
          for row in rows:
              if row.get('status') == 'completed' and row.get('conclusion') == 'success':
                  print(row['databaseId'])
          PY
          downloaded=0
          while read -r rid; do
            [ -z "$rid" ] && continue
            mkdir -p "incoming/indexes/$rid"
            if gh run download "$rid" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "prospective-batch-index-*" \
              --dir "incoming/indexes/$rid" >/dev/null 2>&1; then
              downloaded=$((downloaded+1))
            fi
          done < /tmp/o81-run-ids.txt
          echo "Prior lightweight batch indexes downloaded: $downloaded"

      - name: Build self-healing prospective batch
        shell: bash
        run: |
          python scripts/o8_1_self_healing_batch_collector.py \
            --output-root reports/prospective/o8_1_batch \
            --represented-root incoming/indexes \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --trigger-type "${{ github.event_name }}" \
            --catchup-horizon-minutes 120 \
            --settlement-lag-minutes 15 \
            --native-max-age-minutes 30 \
            --max-slots 8

      - name: Assert O8.1-C batch contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/prospective/o8_1_batch/batch_manifest.json',encoding='utf-8'))
          assert p['risk_engine_allowed'] is False, p
          assert p['raw_radar_archived'] is False, p
          assert p['raw_grib_archived'] is False, p
          assert p['catchup_horizon_minutes'] <= 120, p
          assert p['settlement_lag_minutes'] == 15, p
          assert p['technical_failure_count'] == 0, p
          assert p['explicit_gap_count'] == 0, p
          assert p['deferred_due_run_cap_count'] == 0, p
          for row in p.get('slot_results', []):
              assert row['bundle_complete'] is True, row
              assert row['risk_engine_allowed'] is False, row
              assert row['collection_status'] in {
                  'COMPLETE_FEATURES',
                  'COMPLETE_NO_TRACKABLE_EVENT',
                  'COMPLETE_NO_EMBEDDED_GENESIS',
              }, row
              assert row['as_of_time_guard_pass'] is True, row
          print('PASS_PHASE2L_O8_1_C_SELF_HEALING_BATCH')
          print(json.dumps({
              'state': p['state'],
              'processed': p['requested_slot_count'],
              'native': p['native_slot_count'],
              'recovered': p['recovered_slot_count'],
              'represented_before': p['represented_slot_count_in_horizon'],
          }, indent=2))
          PY

      - name: Write O8.1-C workflow summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('reports/prospective/o8_1_batch/batch_manifest.json')
          print('## LPZ O8.1-C Self-Healing Batch Collector')
          if not p.exists():
              print('- Batch manifest was not produced.')
              raise SystemExit(0)
          r=json.loads(p.read_text(encoding='utf-8'))
          print(f"- State: **{r['state']}**")
          print(f"- Trigger: **{r['trigger_type']}**")
          print(f"- Expected slots in 120m horizon: **{r['expected_slot_count_in_horizon']}**")
          print(f"- Already represented: **{r['represented_slot_count_in_horizon']}**")
          print(f"- Processed this run: **{r['requested_slot_count']}**")
          print(f"- Native / recovered: **{r['native_slot_count']} / {r['recovered_slot_count']}**")
          print(f"- Explicit gaps: **{r['explicit_gap_count']}**")
          print(f"- Technical failures: **{r['technical_failure_count']}**")
          print(f"- Deferred by run cap: **{r['deferred_due_run_cap_count']}**")
          print('- Risk Engine: **LOCKED**')
          PY

      - name: Upload full prospective batch
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prospective-batch-${{ github.run_id }}
          path: reports/prospective/o8_1_batch/
          if-no-files-found: error
          retention-days: 10

      - name: Upload lightweight batch index
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prospective-batch-index-${{ github.run_id }}
          path: reports/prospective/o8_1_batch/batch_manifest.json
          if-no-files-found: error
          retention-days: 10
