name: LPZ Prospective Native Feature Collector

on:
  workflow_dispatch:
  schedule:
    # UTC. Offset five minutes from the public Pages production cycle.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/prospective-feature-collector.yml"
      - "scripts/build_prospective_feature_bundle.py"
      - "tests/test_prospective_feature_bundle.py"

permissions:
  contents: read

concurrency:
  group: lpz-prospective-native-feature-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify ecCodes runtime
        run: python -m eccodes selfcheck

      - name: Decode current JMA radar palette
        run: python scripts/radar_scientific_decode_probe.py --output reports/scientific/radar_scientific_decode.json

      - name: Build current radar morphology
        run: python scripts/radar_morphology_probe.py --output reports/scientific/radar_morphology.json

      - name: Compare rainband orientation with 600-hPa wind
        run: python scripts/radar_wind_orientation_probe.py --morphology reports/scientific/radar_morphology.json --output reports/scientific/radar_wind_orientation.json

      - name: Build multi-frame radar object tracking
        run: python scripts/radar_tracking_probe.py --output reports/scientific/radar_tracking.json

      - name: Classify tracking-cycle applicability
        id: tracking_state
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          p=json.load(open('reports/scientific/radar_tracking.json',encoding='utf-8'))
          if p.get('execution_ok') is not True:
              raise SystemExit('radar tracking transport/execution failed; this is not a no-event cycle')

          proven = p.get('scientific_tracking_proven') is True
          gates = p.get('gates') or {}
          if not proven:
              assert gates.get('fixed_multiframe_mosaic') is True, p
              assert gates.get('component_tracking') is False, p
              assert isinstance(p.get('tracking'), dict), p
              assert len(p.get('frame_valid_times') or []) >= 2, p

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"trackable={'true' if proven else 'false'}\n")
          print('TRACKABLE_COMPONENT_PRESENT' if proven else 'COMPLETE_NO_TRACKABLE_EVENT_CANDIDATE')
          PY

      - name: Build parent/core hierarchy
        if: steps.tracking_state.outputs.trackable == 'true'
        run: python scripts/radar_hierarchy_probe.py --tracking reports/scientific/radar_tracking.json --output reports/scientific/radar_hierarchy.json

      - name: Classify embedded-genesis applicability
        id: hierarchy_state
        if: steps.tracking_state.outputs.trackable == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          p=json.load(open('reports/scientific/radar_hierarchy.json',encoding='utf-8'))
          if p.get('execution_ok') is not True or p.get('scientific_hierarchy_proven') is not True:
              raise SystemExit('hierarchy execution/integrity failed; this is not a normal no-genesis cycle')
          count = int(p.get('embedded_core_genesis_event_count') or 0)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"genesis_required={'true' if count > 0 else 'false'}\n")
          print(f"EMBEDDED_CORE_GENESIS_EVENT_COUNT={count}")
          PY

      - name: Build parent temporal descriptors
        if: steps.tracking_state.outputs.trackable == 'true'
        run: python scripts/radar_temporal_descriptor.py --tracking reports/scientific/radar_tracking.json --hierarchy reports/scientific/radar_hierarchy.json --output reports/scientific/radar_temporal.json

      - name: Build parent-motion-relative genesis geometry
        if: steps.tracking_state.outputs.trackable == 'true' && steps.hierarchy_state.outputs.genesis_required == 'true'
        run: python scripts/radar_genesis_geometry_report.py --tracking reports/scientific/radar_tracking.json --hierarchy reports/scientific/radar_hierarchy.json --output reports/scientific/radar_genesis_geometry.json

      - name: Build 850-hPa inflow-relative genesis geometry
        if: steps.tracking_state.outputs.trackable == 'true' && steps.hierarchy_state.outputs.genesis_required == 'true'
        run: python scripts/radar_inflow_geometry_probe.py --genesis reports/scientific/radar_genesis_geometry.json --output reports/scientific/radar_inflow_geometry.json

      - name: Build parent precursor feature table
        if: steps.tracking_state.outputs.trackable == 'true' && steps.hierarchy_state.outputs.genesis_required == 'true'
        run: |
          python scripts/build_parent_precursor_report.py \
            --temporal reports/scientific/radar_temporal.json \
            --inflow reports/scientific/radar_inflow_geometry.json \
            --output reports/scientific/parent_precursor_features.json \
            --csv-output reports/scientific/parent_precursor_features.csv

      - name: Build prospective derived-feature bundle
        run: |
          python scripts/build_prospective_feature_bundle.py \
            --scientific-dir reports/scientific \
            --output reports/prospective/prospective_feature_bundle.json \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}"

      - name: Assert prospective scientific lock
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/prospective/prospective_feature_bundle.json',encoding='utf-8'))
          assert p['bundle_complete'] is True, p
          assert p['collection_status'] in {
              'COMPLETE_FEATURES',
              'COMPLETE_NO_TRACKABLE_EVENT',
              'COMPLETE_NO_EMBEDDED_GENESIS',
          }, p
          assert p['candidate_structure_is_lpz_classification'] is False, p
          assert p['no_event_state_is_negative_label'] is False, p
          assert p['raw_radar_archived'] is False, p
          assert p['raw_grib_archived'] is False, p
          assert p['lpz_classification'] is None, p
          assert p['risk_score'] is None, p
          assert p['risk_engine_allowed'] is False, p
          print(f"Prospective collection status: {p['collection_status']}")
          print('Prospective scientific lock invariant: PASS')
          PY

      - name: Upload prospective feature bundle
        uses: actions/upload-artifact@v6
        with:
          name: prospective-feature-bundle-${{ github.run_id }}
          path: reports/prospective/prospective_feature_bundle.json
          if-no-files-found: error
          retention-days: 10
