name: LPZ Phase 2L-A Daily Census Recovery and Merge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_DAILY_CENSUS_RECOVERY_TRIGGER.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: lpz-phase2l-daily-census-recovery
  cancel-in-progress: false

jobs:
  recover-month:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month:
          - 2023-07
          - 2023-09
          - 2023-11
          - 2023-12
          - 2024-03
          - 2024-11
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify Earthdata credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Recover missing monthly census shard with hardened login retry
        run: |
          python scripts/phase2l_daily_census_month.py \
            --month "${{ matrix.month }}" \
            --output "reports/historical/phase2l_census_${{ matrix.month }}.json"
      - name: Assert recovered shard guardrails
        run: |
          python - <<'PY'
          import json,glob
          p=json.load(open(glob.glob('reports/historical/phase2l_census_*.json')[0],encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_MONTHLY_DUAL_SOURCE_CENSUS', p
          assert p['schema_version']=='1.1.0', p
          assert p['threshold_selected'] is False
          assert p['candidate_generated'] is False
          assert p['hard_negative_label'] is None
          assert p['source_fusion_used'] is False
          assert p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False
          assert p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-census-recovery-${{ matrix.month }}
          path: reports/historical/phase2l_census_${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: recover-month
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download successful original monthly shards
        uses: actions/download-artifact@v4
        with:
          pattern: phase2l-census-*
          path: work/original
          repository: ${{ github.repository }}
          run-id: 34433650943
          github-token: ${{ github.token }}
      - name: Download recovered missing monthly shards
        uses: actions/download-artifact@v4
        with:
          pattern: phase2l-census-recovery-*
          path: work/recovery
      - name: Download frozen Phase 2K positive baseline
        uses: actions/download-artifact@v4
        with:
          name: development-positive-environment-baseline-34423912911
          path: work/positive
          repository: ${{ github.repository }}
          run-id: 34423912911
          github-token: ${{ github.token }}
      - name: Merge 24 complete shards
        run: |
          python scripts/phase2l_merge_daily_census.py \
            --shard-dir work \
            --positive-baseline work/positive/development_positive_environment_baseline.json \
            --output reports/historical/phase2l_development_daily_rainfall_census.json
      - name: Assert complete Development census and strict research guardrails
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_development_daily_rainfall_census.json',encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_DEVELOPMENT_DAILY_RAINFALL_CENSUS', p
          assert p['schema_version']=='1.1.0', p
          assert p['day_count']==731, p
          assert p['source_day_row_count']==1462, p
          assert len(p['source_day_rows'])==1462, p
          assert p['positive_episode_count']==65, p
          assert 1 <= p['positive_unique_date_count'] <= 65, p
          assert p['source_fusion_used'] is False
          assert p['threshold_selected'] is False
          assert p['candidate_generated'] is False
          assert p['hard_negative_label'] is None
          assert p['gsmap_used_for_discovery'] is False
          assert p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False
          assert p['prospective_holdout_used'] is False
          assert p['risk_score'] is None
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-development-daily-rainfall-census-final-${{ github.run_id }}
          path: reports/historical/phase2l_development_daily_rainfall_census.json
          if-no-files-found: error
          retention-days: 90
