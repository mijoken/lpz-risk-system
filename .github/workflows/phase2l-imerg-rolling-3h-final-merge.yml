name: LPZ Phase 2L-C IMERG Rolling 3h Final Merge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_C_IMERG_ROLLING_3H_FINAL_MERGE_TRIGGER.txt"

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .

      - name: Download original 20 available monthly shards
        uses: actions/download-artifact@v4
        with:
          pattern: phase2l-imerg-rolling-3h-*
          path: work/original
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: 34484925277
          github-token: ${{ github.token }}

      - name: Download recovered 2024-02 2024-05 2024-10 shards
        uses: actions/download-artifact@v4
        with:
          pattern: phase2l-imerg-rolling-3h-*
          path: work/recovery
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: 34547474867
          github-token: ${{ github.token }}

      - name: Download IPv4 recovered 2023-03 shard
        uses: actions/download-artifact@v4
        with:
          name: phase2l-imerg-rolling-3h-2023-03-ipv4
          path: work/ipv4/phase2l-imerg-rolling-3h-2023-03-ipv4
          repository: ${{ github.repository }}
          run-id: 34548057245
          github-token: ${{ github.token }}

      - name: Assemble canonical 24 shard set
        run: |
          set -euo pipefail
          mkdir -p work/shards
          find work/original work/recovery work/ipv4 -type f -name 'phase2l_imerg_rolling_3h_20??-??.csv' -print
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          roots=[Path('work/original'),Path('work/recovery'),Path('work/ipv4')]
          preferred={'2023-03':'ipv4','2024-02':'recovery','2024-05':'recovery','2024-10':'recovery'}
          found={}
          for root in roots:
              tag=root.name
              for p in root.rglob('phase2l_imerg_rolling_3h_20??-??.csv'):
                  m=re.search(r'(20\d\d-\d\d)',p.name)
                  if not m: continue
                  month=m.group(1)
                  rank=2 if preferred.get(month)==tag else (1 if month not in preferred and tag=='original' else 0)
                  if month not in found or rank>found[month][0]: found[month]=(rank,p)
          expected=[f'{y}-{m:02d}' for y in (2023,2024) for m in range(1,13)]
          missing=[m for m in expected if m not in found]
          if missing: raise SystemExit(f'missing months: {missing}')
          out=Path('work/shards'); out.mkdir(exist_ok=True)
          for month in expected:
              src=found[month][1]
              dst=out/f'phase2l_imerg_rolling_3h_{month}.csv'
              shutil.copy2(src,dst)
              # copy matching monthly JSON when available for provenance
              js=src.with_suffix('.json')
              if js.exists(): shutil.copy2(js,out/js.name)
          print('canonical months', len(expected))
          PY

      - name: Merge and audit complete exact rolling 3h refinement
        run: |
          python scripts/phase2l_merge_imerg_rolling_3h.py \
            --shards-dir work/shards \
            --output-dir reports/historical/phase2l_imerg_rolling_3h_full

      - name: Assert final guardrails
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_imerg_rolling_3h_full/phase2l_imerg_rolling_3h_full.json',encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_IMERG_ROLLING_3H_REFINEMENT_5943_REGION_DAYS', p
          assert p['refined_region_day_count']==5943
          assert p['unique_utc_day_count']==449
          assert p['rolling_window_count_per_region_day']==53
          assert p['candidate_membership_changed'] is False
          assert p['source_fusion_used'] is False
          assert p['environment_variables_used'] is False
          assert p['hard_negative_label'] is None
          assert p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False
          assert p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          print(json.dumps(p,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-imerg-rolling-3h-full-final-${{ github.run_id }}
          path: reports/historical/phase2l_imerg_rolling_3h_full
          if-no-files-found: error
          retention-days: 90
