name: LPZ Phase 2L-A Development Daily Rainfall Census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_DAILY_CENSUS_TRIGGER.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: lpz-phase2l-development-daily-rainfall-census
  cancel-in-progress: false

jobs:
  census-month:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month:
          - 2023-01
          - 2023-02
          - 2023-03
          - 2023-04
          - 2023-05
          - 2023-06
          - 2023-07
          - 2023-08
          - 2023-09
          - 2023-10
          - 2023-11
          - 2023-12
          - 2024-01
          - 2024-02
          - 2024-03
          - 2024-04
          - 2024-05
          - 2024-06
          - 2024-07
          - 2024-08
          - 2024-09
          - 2024-10
          - 2024-11
          - 2024-12
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify Earthdata credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Build monthly source-native census shard
        run: |
          python scripts/phase2l_daily_census_month.py \
            --month "${{ matrix.month }}" \
            --output "reports/historical/phase2l_census_${{ matrix.month }}.json"
      - name: Assert no selection leakage
        run: |
          python - <<'PY'
          import json,glob
          p=json.load(open(glob.glob('reports/historical/phase2l_census_*.json')[0],encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_MONTHLY_DUAL_SOURCE_CENSUS', p
          assert p['threshold_selected'] is False
          assert p['candidate_generated'] is False
          assert p['hard_negative_label'] is None
          assert p['source_fusion_used'] is False
          assert p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False
          assert p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2l-census-${{ matrix.month }}
          path: reports/historical/phase2l_census_${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: census-month
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download all monthly census shards
        uses: actions/download-artifact@v4
        with:
          pattern: phase2l-census-*
          path: work/census
          merge-multiple: false
      - name: Download frozen Phase 2K positive baseline
        uses: actions/download-artifact@v4
        with:
          name: development-positive-environment-baseline-34423912911
          path: work/positive
          repository: ${{ github.repository }}
          run-id: 34423912911
          github-token: ${{ github.token }}
      - name: Merge 24 shards and audit Positive daily context
        run: |
          python scripts/phase2l_merge_daily_census.py \
            --shard-dir work/census \
            --positive-baseline work/positive/development_positive_environment_baseline.json \
            --output reports/historical/phase2l_development_daily_rainfall_census.json
      - name: Assert complete Development-only census
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_development_daily_rainfall_census.json',encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_DEVELOPMENT_DAILY_RAINFALL_CENSUS', p
          assert p['day_count']==731, p
          assert p['source_day_row_count']==1462, p
          assert p['positive_episode_count']==65, p
          assert p['source_fusion_used'] is False
          assert p['threshold_selected'] is False
          assert p['candidate_generated'] is False
          assert p['hard_negative_label'] is None
          assert p['gsmap_used_for_discovery'] is False
          assert p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False
          assert p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-development-daily-rainfall-census-${{ github.run_id }}
          path: reports/historical/phase2l_development_daily_rainfall_census.json
          if-no-files-found: error
          retention-days: 90
