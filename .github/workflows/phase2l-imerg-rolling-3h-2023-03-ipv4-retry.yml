name: LPZ Phase 2L-C IMERG Rolling 3h 2023-03 IPv4 Retry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_C_IMERG_2023_03_IPV4_RETRY_TRIGGER.txt"

permissions:
  contents: read
  actions: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prefer IPv4 for external auth routing
        run: |
          set -euo pipefail
          echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf
          getent ahostsv4 urs.earthdata.nasa.gov
      - name: Install package
        run: python -m pip install -e .
      - name: Verify Earthdata secrets
        run: |
          set -euo pipefail
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Download frozen CMORPH candidate reservoir
        uses: actions/download-artifact@v4
        with:
          name: phase2l-cmorph-candidate-reservoir-34469303188
          path: work/reservoir
          repository: ${{ github.repository }}
          run-id: 34469303188
          github-token: ${{ github.token }}
      - name: Reconstruct 2023-03 exact rolling 3h maxima
        run: |
          python scripts/phase2l_imerg_rolling_3h_month.py \
            --reservoir work/reservoir/phase2l_cmorph_candidate_reservoir.csv \
            --month "2023-03" \
            --output-dir "reports/historical/phase2l_imerg_rolling_3h/2023-03"
      - name: Assert recovered month guardrails
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_imerg_rolling_3h/2023-03/phase2l_imerg_rolling_3h_2023-03.json',encoding='utf-8'))
          assert p['month']=='2023-03', p
          assert p['gate']=='PASS_IMERG_ROLLING_3H_MONTH', p
          assert p['candidate_region_day_count']==p['refined_region_day_count'], p
          assert p['rolling_window_count_per_region_day']==53, p
          assert p['candidate_membership_changed'] is False, p
          assert p['source_fusion_used'] is False, p
          assert p['environment_variables_used'] is False, p
          assert p['validation_data_used'] is False, p
          assert p['retrospective_2026_used'] is False, p
          assert p['prospective_holdout_used'] is False, p
          assert p['risk_engine_allowed'] is False, p
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-imerg-rolling-3h-2023-03-ipv4
          path: reports/historical/phase2l_imerg_rolling_3h/2023-03
          if-no-files-found: error
          retention-days: 90
