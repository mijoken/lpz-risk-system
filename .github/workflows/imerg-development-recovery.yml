name: LPZ IMERG Development Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/IMERG_RECOVERY_TRIGGER.txt"

concurrency:
  group: lpz-imerg-development-recovery
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
  EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

jobs:
  recover-imerg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify Earthdata credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Preflight Earthdata route without credentials
        shell: bash
        run: |
          python - <<'PY'
          import urllib.error, urllib.request
          url='https://urs.earthdata.nasa.gov/'
          req=urllib.request.Request(url, method='HEAD', headers={'User-Agent':'lpz-risk-system/0.1 research'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print('EARTHDATA_ROUTE_REACHABLE', r.status)
          except urllib.error.HTTPError as e:
              # Any HTTP response proves that the network route reached Earthdata.
              print('EARTHDATA_ROUTE_REACHABLE_HTTP', e.code)
          except Exception as e:
              print('EARTHDATA_ROUTE_UNREACHABLE', type(e).__name__, str(e))
              raise
          PY
      - name: Download frozen Phase 2I plan from source run
        uses: actions/download-artifact@v4
        with:
          name: development-rainfall-plan
          path: work/plan
          repository: ${{ github.repository }}
          run-id: 34416417535
          github-token: ${{ github.token }}
      - name: Recover only missing IMERG tasks sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/historical/tasks
          for task in RAINPROD-38e450d1d3e0bc RAINPROD-b1e485f3919159; do
            success=0
            for delay in 0 30 120; do
              if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
              echo "IMERG recovery attempt task=${task} delay=${delay}s"
              if python scripts/reconstruct_development_rainfall_task.py \
                --plan work/plan/development_rainfall_production_plan.json \
                --window-manifest work/plan/development_rainfall_window_manifest.json \
                --geometry work/plan/development_primary_subdivision_geometry.geojson \
                --task-id "$task" \
                --output "reports/historical/tasks/${task}.json"; then
                success=1
                break
              fi
            done
            if [ "$success" -ne 1 ]; then
              echo "FAIL: IMERG recovery exhausted for ${task}" >&2
              exit 2
            fi
            python - "$task" <<'PY'
          import json,sys
          from pathlib import Path
          task=sys.argv[1]
          p=json.loads(Path(f'reports/historical/tasks/{task}.json').read_text(encoding='utf-8'))
          assert p['source_id']=='NASA_IMERG_FINAL_V07', p
          assert p['gate']=='PASS_TASK_REAL_PAYLOAD_RECONSTRUCTION', p
          assert p['candidate_threshold_selected'] is False, p
          assert p['risk_engine_allowed'] is False, p
          PY
          done
      - name: Assert exactly two recovered IMERG reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('reports/historical/tasks').glob('RAINPROD-*.json'))
          assert len(files)==2, files
          for f in files:
              p=json.loads(f.read_text(encoding='utf-8'))
              assert p['source_id']=='NASA_IMERG_FINAL_V07', p
              assert p['gate']=='PASS_TASK_REAL_PAYLOAD_RECONSTRUCTION', p
              assert p['risk_engine_allowed'] is False, p
          print('PASS_IMERG_RECOVERY', [f.stem for f in files])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imerg-recovery-${{ github.run_id }}
          path: reports/historical/tasks/*.json
          if-no-files-found: warn
          retention-days: 90
