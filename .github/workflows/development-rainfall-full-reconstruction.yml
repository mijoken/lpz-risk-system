name: LPZ Development Rainfall Full Reconstruction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/DEVELOPMENT_RAINFALL_FULL_TRIGGER.txt"

permissions:
  contents: read

env:
  GSMAP_FTP_USERNAME: ${{ secrets.GSMAP_FTP_USERNAME }}
  GSMAP_FTP_PASSWORD: ${{ secrets.GSMAP_FTP_PASSWORD }}
  EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
  EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Build frozen DEVELOPMENT registries and production plan
        run: |
          python scripts/build_historical_case_registry.py \
            --config config/historical_case_sources.json \
            --output reports/historical/historical_case_source_registry.json
          python scripts/build_positive_case_registry.py \
            --source-audit reports/historical/historical_case_source_registry.json \
            --config config/historical_case_sources.json \
            --output reports/historical/positive_case_registry.json
          python scripts/build_positive_episode_registry.py \
            --positive-registry reports/historical/positive_case_registry.json \
            --policy config/historical_split_policy.json \
            --output reports/historical/positive_episode_registry.json
          python scripts/build_development_rainfall_window_manifest.py \
            --episode-registry reports/historical/positive_episode_registry.json \
            --output reports/historical/development_rainfall_window_manifest.json
          python scripts/build_development_rainfall_production_plan.py \
            --window-manifest reports/historical/development_rainfall_window_manifest.json \
            --output reports/historical/development_rainfall_production_plan.json
      - name: Assert frozen production counts
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/development_rainfall_production_plan.json',encoding='utf-8'))
          assert p['input_unique_window_count']==567, p
          assert p['unique_native_field_count']==590, p
          assert p['unique_payload_count']==481, p
          assert p['production_task_count']==69, p
          assert p['validation_data_used'] is False
          assert p['retrospective_test_data_used'] is False
          assert p['prospective_holdout_data_used'] is False
          assert p['candidate_threshold_selected'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - name: Build official JMA polygons once
        run: |
          python scripts/build_development_rainfall_geometry.py \
            --plan reports/historical/development_rainfall_production_plan.json \
            --output reports/historical/development_primary_subdivision_geometry.geojson
      - name: Build dynamic matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('reports/historical/development_rainfall_production_plan.json',encoding='utf-8'))
          print('matrix='+json.dumps({'task_id':[t['task_id'] for t in p['tasks']]},separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: development-rainfall-plan
          path: |
            reports/historical/positive_episode_registry.json
            reports/historical/development_rainfall_window_manifest.json
            reports/historical/development_rainfall_production_plan.json
            reports/historical/development_primary_subdivision_geometry.geojson
          if-no-files-found: error
          retention-days: 90

  reconstruct:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: development-rainfall-plan
          path: work/plan
      - name: Verify acquisition credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GSMAP_FTP_USERNAME:-}"
          test -n "${GSMAP_FTP_PASSWORD:-}"
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Reconstruct real payload task
        run: |
          mkdir -p reports/historical/tasks
          python scripts/reconstruct_development_rainfall_task.py \
            --plan work/plan/development_rainfall_production_plan.json \
            --window-manifest work/plan/development_rainfall_window_manifest.json \
            --geometry work/plan/development_primary_subdivision_geometry.geojson \
            --task-id "${{ matrix.task_id }}" \
            --output "reports/historical/tasks/${{ matrix.task_id }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rainfall-task-${{ matrix.task_id }}
          path: reports/historical/tasks/${{ matrix.task_id }}.json
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: [prepare, reconstruct]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: development-rainfall-plan
          path: work/plan
      - uses: actions/download-artifact@v4
        with:
          pattern: rainfall-task-*
          path: work/tasks
          merge-multiple: true
      - name: Merge and enforce completeness
        run: |
          python scripts/merge_development_rainfall_reconstruction.py \
            --plan work/plan/development_rainfall_production_plan.json \
            --window-manifest work/plan/development_rainfall_window_manifest.json \
            --episode-registry work/plan/positive_episode_registry.json \
            --task-dir work/tasks \
            --output reports/historical/development_rainfall_reconstruction.json \
            --summary-output reports/historical/development_rainfall_reconstruction_summary.json
      - name: Assert final gates
        if: success()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/development_rainfall_reconstruction_summary.json',encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_DEVELOPMENT_RECONSTRUCTION', p
          assert p['expected_task_count']==69 and p['received_task_report_count']==69, p
          assert p['expected_window_count']==567 and p['reconstructed_window_count']==567, p
          assert p['expected_anchor_provider_mapping_count']==1503, p
          assert p['reconstructed_anchor_provider_mapping_count']==1503, p
          assert p['development_local_episode_count']==65, p
          assert p['expected_episode_representative_count']==195, p
          assert p['episode_representative_count']==195, p
          assert p['candidate_threshold_selected'] is False
          assert p['validation_data_used'] is False
          assert p['retrospective_test_data_used'] is False
          assert p['prospective_holdout_data_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-rainfall-reconstruction-final-${{ github.run_id }}
          path: |
            reports/historical/development_rainfall_reconstruction.json
            reports/historical/development_rainfall_reconstruction_summary.json
          if-no-files-found: warn
          retention-days: 90
