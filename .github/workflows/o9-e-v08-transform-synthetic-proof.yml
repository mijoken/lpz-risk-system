name: O9-E V08 Development Transform Synthetic Proof

on:
  push:
    branches: [o9-e-development-transform-freeze]
    paths:
      - ".github/workflows/o9-e-v08-transform-synthetic-proof.yml"
      - "src/lpz_risk/o9_v08_transform.py"
      - "scripts/o9_v08_transform_freeze.py"
      - "tests/test_o9_e_v08_transform_freeze_synthetic.py"
      - "tests/test_o9_e_validation_csv_hash_binding.py"
      - "scripts/phase2l_d_rainfall_matched_comparison.py"
      - "scripts/o9_v08_reentry_harness.py"
      - "tests/test_o9_v08_reentry_harness.py"
      - "tests/test_o9_d_v08_rainfall_rebuild_synthetic.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o9-e-v08-transform-synthetic-proof
  cancel-in-progress: false

jobs:
  synthetic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile O9-E code
        run: |
          python -m compileall -q \
            src/lpz_risk/o9_v08_transform.py \
            scripts/o9_v08_transform_freeze.py \
            tests/test_o9_e_v08_transform_freeze_synthetic.py \
            tests/test_o9_e_validation_csv_hash_binding.py

      - name: Run O9-E synthetic transform and regression proof
        run: |
          python -m pytest -q \
            tests/test_o9_e_v08_transform_freeze_synthetic.py \
            tests/test_o9_e_validation_csv_hash_binding.py \
            tests/test_o9_d_v08_rainfall_rebuild_synthetic.py \
            tests/test_o9_v08_reentry_harness.py \
            tests/test_o9_v08_required_coverage_gate.py \
            tests/test_imerg_final_versioned.py

      - name: Assert 2025 science remains sealed
        run: |
          python - <<'PY'
          from scripts import o9_v08_reentry_harness as h
          report = h.evaluate_chain(h.ROOT, h.ROOT / 'research/o9/reentry')
          assert report['state'] == 'WAIT_IMERG_FINAL_V08_NOT_AVAILABLE_OR_NOT_PROVEN', report
          assert report['era5_2025_may_be_opened'] is False, report
          assert report['confirmatory_run_may_execute'] is False, report
          assert report['risk_engine_allowed'] is False, report
          assert report['public_risk_release_allowed'] is False, report
          print('PASS_O9_E_SYNTHETIC_PROOF_REMAINS_SCIENTIFICALLY_LOCKED')
          PY

      - name: Write proof summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## O9-E V08 Development-only Transform Synthetic Proof
          - Transform math: **Phase 2L-D equivalent**
          - Fit population: **Development V08 5,943 only**
          - Validation fit rows: **0**
          - Metric transform: **log1p + Development global z-score (ddof=0)**
          - PCA: **Development covariance only (ddof=0)**
          - Matching components: **PC1 + PC2**
          - Validation: **frozen transform application only**
          - Validation rows / positives: **1,218 / 23**
          - Validation CSV binding: **must match O9-D SHA256 exactly**
          - 2025 ERA5: **SEALED**
          - Confirmatory Primary: **NOT RUN**
          - Risk Engine: **LOCKED**
          EOF
