name: O9-D V08 Rainfall Rebuild Synthetic Proof

on:
  push:
    branches: [o9-d-v08-rainfall-rebuild]
    paths:
      - ".github/workflows/o9-d-v08-rainfall-synthetic-proof.yml"
      - "src/lpz_risk/o9_v08_rebuild.py"
      - "src/lpz_risk/imerg_final.py"
      - "src/lpz_risk/canonical_rainfall.py"
      - "scripts/o9_v08_rainfall_rebuild.py"
      - "tests/test_o9_d_v08_rainfall_rebuild_synthetic.py"
      - "tests/test_imerg_final_versioned.py"
      - "tests/test_o9_v08_reentry_harness.py"
      - "tests/test_o9_v08_required_coverage_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: o9-d-v08-rainfall-synthetic-proof
  cancel-in-progress: false

jobs:
  synthetic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile O9-D code
        run: |
          python -m compileall -q \
            src/lpz_risk/o9_v08_rebuild.py \
            src/lpz_risk/imerg_final.py \
            scripts/o9_v08_rainfall_rebuild.py \
            tests/test_o9_d_v08_rainfall_rebuild_synthetic.py

      - name: Run O9-D synthetic scientific and resume proof
        run: |
          python -m pytest -q \
            tests/test_o9_d_v08_rainfall_rebuild_synthetic.py \
            tests/test_imerg_final_versioned.py \
            tests/test_o9_v08_reentry_harness.py \
            tests/test_o9_v08_required_coverage_gate.py

      - name: Assert no scientific unlock occurred
        run: |
          python - <<'PY'
          from scripts import o9_v08_reentry_harness as h
          report = h.evaluate_chain(h.ROOT, h.ROOT / 'research/o9/reentry')
          assert report['risk_engine_allowed'] is False, report
          assert report['public_risk_release_allowed'] is False, report
          assert report['era5_2025_may_be_opened'] is False, report
          assert report['confirmatory_run_may_execute'] is False, report
          assert report['state'] == 'WAIT_IMERG_FINAL_V08_NOT_AVAILABLE_OR_NOT_PROVEN', report
          print('PASS_O9_D_SYNTHETIC_PROOF_REMAINS_SCIENTIFICALLY_LOCKED')
          PY

      - name: Write proof summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## O9-D V08 Rainfall Rebuild Synthetic Proof
          - Exact slot contract: **58 half-hour slots**
          - Rolling contract: **53 exact 3-hour windows**
          - Frozen populations: **Development 5,943 / Validation 1,218 / Positive 23**
          - Version mixing: **V07 rejected**
          - Resume: **valid checkpoint skips network/download**
          - 2025 ERA5: **SEALED**
          - Confirmatory Primary: **NOT RUN**
          - Risk Engine: **LOCKED**
          EOF
