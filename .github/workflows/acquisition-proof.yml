name: LPZ Scientific Data and Evidence CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/acquisition_probe.py"
      - "scripts/build_canonical_snapshot.py"
      - "scripts/validate_scientific_evidence.py"
      - "scripts/gfs_scientific_decode_probe.py"
      - "scripts/radar_scientific_decode_probe.py"
      - "scripts/radar_morphology_probe.py"
      - "scripts/radar_wind_orientation_probe.py"
      - "scripts/radar_tracking_probe.py"
      - "scripts/radar_hierarchy_probe.py"
      - "scripts/radar_temporal_descriptor.py"
      - "scripts/radar_genesis_geometry_report.py"
      - "scripts/radar_inflow_geometry_probe.py"
      - "scripts/build_parent_precursor_report.py"
      - "scripts/build_historical_case_registry.py"
      - "src/**"
      - "config/data_sources.json"
      - "config/scientific_variable_requirements.json"
      - "config/historical_case_sources.json"
      - "research/evidence/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/acquisition-proof.yml"
  schedule:
    # Still conservative while Phase 1 scientific decoding is under validation.
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: lpz-scientific-data-evidence-ci
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify ecCodes runtime
        run: python -m eccodes selfcheck

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Scientific Evidence Engine
        run: |
          python scripts/validate_scientific_evidence.py \
            --registry research/evidence/scientific_evidence_registry.json \
            --requirements config/scientific_variable_requirements.json \
            --output reports/evidence/scientific_evidence_validation.json

      # Historical official-case CSVs change infrequently. Audit them on pushes
      # and manual runs, not every scheduled 30-minute live probe.
      - name: Audit official JMA historical LPZ case sources
        if: github.event_name != 'schedule'
        run: |
          python scripts/build_historical_case_registry.py \
            --config config/historical_case_sources.json \
            --output reports/historical/historical_case_source_registry.json

      - name: Run acquisition probe
        run: |
          python scripts/acquisition_probe.py \
            --output reports/acquisition/acquisition_report.json

      - name: Build canonical snapshot
        run: |
          python scripts/build_canonical_snapshot.py \
            --acquisition-report reports/acquisition/acquisition_report.json \
            --output reports/canonical/canonical_snapshot.json

      - name: Run GFS scientific decode proof
        run: |
          python scripts/gfs_scientific_decode_probe.py \
            --output reports/scientific/gfs_scientific_decode.json

      # These live radar steps traverse multiple JMA tiles and are deliberately
      # NOT run on the 30-minute schedule or every ordinary source/test commit.
      # Trigger via workflow_dispatch, or a push commit containing [radar-live].
      - name: Run radar scientific decode proof
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/radar_scientific_decode_probe.py \
            --output reports/scientific/radar_scientific_decode.json

      - name: Run radar morphology proof
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/radar_morphology_probe.py \
            --output reports/scientific/radar_morphology.json

      - name: Run radar vs 600-hPa wind orientation proof
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/radar_wind_orientation_probe.py \
            --morphology reports/scientific/radar_morphology.json \
            --output reports/scientific/radar_wind_orientation.json

      - name: Run multi-frame radar object tracking proof
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/radar_tracking_probe.py \
            --output reports/scientific/radar_tracking.json

      - name: Run parent-envelope embedded-core hierarchy proof
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/radar_hierarchy_probe.py \
            --tracking reports/scientific/radar_tracking.json \
            --output reports/scientific/radar_hierarchy.json

      - name: Build parent temporal descriptors
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/radar_temporal_descriptor.py \
            --tracking reports/scientific/radar_tracking.json \
            --hierarchy reports/scientific/radar_hierarchy.json \
            --output reports/scientific/radar_temporal.json

      - name: Build embedded-core genesis relative-motion geometry
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/radar_genesis_geometry_report.py \
            --tracking reports/scientific/radar_tracking.json \
            --hierarchy reports/scientific/radar_hierarchy.json \
            --output reports/scientific/radar_genesis_geometry.json

      - name: Run genesis vs 850-hPa inflow geometry proof
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/radar_inflow_geometry_probe.py \
            --genesis reports/scientific/radar_genesis_geometry.json \
            --output reports/scientific/radar_inflow_geometry.json

      - name: Build per-parent precursor feature table
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar-live]'))
        run: |
          python scripts/build_parent_precursor_report.py \
            --temporal reports/scientific/radar_temporal.json \
            --inflow reports/scientific/radar_inflow_geometry.json \
            --output reports/scientific/parent_precursor_features.json \
            --csv-output reports/scientific/parent_precursor_features.csv

      - name: Upload Phase 0.5 / 1 / 2A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lpz-scientific-evidence-${{ github.run_id }}
          path: |
            reports/acquisition/acquisition_report.json
            reports/canonical/canonical_snapshot.json
            reports/evidence/scientific_evidence_validation.json
            reports/historical/historical_case_source_registry.json
            reports/scientific/gfs_scientific_decode.json
            reports/scientific/radar_scientific_decode.json
            reports/scientific/radar_morphology.json
            reports/scientific/radar_wind_orientation.json
            reports/scientific/radar_tracking.json
            reports/scientific/radar_hierarchy.json
            reports/scientific/radar_temporal.json
            reports/scientific/radar_genesis_geometry.json
            reports/scientific/radar_inflow_geometry.json
            reports/scientific/parent_precursor_features.json
            reports/scientific/parent_precursor_features.csv
          if-no-files-found: warn
          retention-days: 30
