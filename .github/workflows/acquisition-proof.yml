name: Phase 0.5 Acquisition Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/acquisition_probe.py"
      - "scripts/build_canonical_snapshot.py"
      - "scripts/validate_scientific_evidence.py"
      - "src/**"
      - "config/data_sources.json"
      - "research/evidence/**"
      - "tests/**"
      - ".github/workflows/acquisition-proof.yml"
  schedule:
    # Start conservatively during the proof phase. Move to 5-minute cadence
    # only after upstream load, runtime, and failure behavior are measured.
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: phase0-5-acquisition-proof
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Scientific Evidence Engine
        run: python scripts/validate_scientific_evidence.py --registry research/evidence/scientific_evidence_registry.json --output reports/evidence/scientific_evidence_validation.json

      - name: Run acquisition probe
        run: python scripts/acquisition_probe.py --output reports/acquisition/acquisition_report.json

      - name: Build canonical snapshot
        run: python scripts/build_canonical_snapshot.py --acquisition-report reports/acquisition/acquisition_report.json --output reports/canonical/canonical_snapshot.json

      - name: Upload Phase 0.5 / 1A / 1B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lpz-acquisition-canonical-evidence-${{ github.run_id }}
          path: |
            reports/acquisition/acquisition_report.json
            reports/canonical/canonical_snapshot.json
            reports/evidence/scientific_evidence_validation.json
          if-no-files-found: warn
          retention-days: 30
