name: LPZ Phase 2L Daily Screening Payload Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_DAILY_SCREENING_PROOF_TRIGGER.txt"

permissions:
  contents: read

env:
  EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
  EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run dual daily payload probe
        run: |
          python scripts/phase2l_daily_screening_payload_probe.py \
            --date 2023-07-10 \
            --output reports/historical/phase2l_daily_screening_payload_proof.json
      - name: Assert research guardrails
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_daily_screening_payload_proof.json',encoding='utf-8'))
          assert p['gate']=='PASS_DUAL_DAILY_SCREENING_PAYLOAD_PROOF', p
          assert p['threshold_selected'] is False, p
          assert p['candidate_generated'] is False, p
          assert p['hard_negative_label'] is None, p
          assert p['validation_data_used'] is False, p
          assert p['risk_engine_allowed'] is False, p
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2l-daily-screening-payload-proof-${{ github.run_id }}
          path: reports/historical/phase2l_daily_screening_payload_proof.json
          if-no-files-found: error
          retention-days: 90
