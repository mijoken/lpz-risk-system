name: O8.1-C Branch Proof

on:
  push:
    branches: [o8-1-c-self-healing]
    paths:
      - ".github/workflows/o8-1-c-branch-proof.yml"
      - "scripts/o8_1_self_healing_batch_collector.py"
      - "scripts/build_prospective_feature_bundle.py"
      - "tests/test_o8_1_self_healing_batch.py"

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m eccodes selfcheck
      - run: python -m pytest -q tests/test_o8_1_self_healing_batch.py
      - name: Run isolated self-healing batch proof
        run: |
          python scripts/o8_1_self_healing_batch_collector.py \
            --output-root reports/prospective/o8_1_batch \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --trigger-type branch_proof \
            --catchup-horizon-minutes 120 \
            --settlement-lag-minutes 15 \
            --native-max-age-minutes 30 \
            --max-slots 8
      - name: Assert proof
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/prospective/o8_1_batch/batch_manifest.json',encoding='utf-8'))
          assert p['technical_failure_count'] == 0, p
          assert p['explicit_gap_count'] == 0, p
          assert p['deferred_due_run_cap_count'] == 0, p
          assert p['risk_engine_allowed'] is False, p
          for row in p['slot_results']:
              assert row['bundle_complete'] is True, row
              assert row['as_of_time_guard_pass'] is True, row
          print('PASS_PHASE2L_O8_1_C_BRANCH_PROOF')
          PY
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: o8-1-c-branch-proof-${{ github.run_id }}
          path: reports/prospective/o8_1_batch/
          if-no-files-found: error
          retention-days: 3
