name: LPZ Phase 2L-C IMERG Official Polygon Coverage Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_C_IMERG_POLYGON_COVERAGE_PROOF_TRIGGER.txt"

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify Earthdata secrets
        run: |
          set -euo pipefail
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Download frozen CMORPH candidate reservoir
        uses: actions/download-artifact@v4
        with:
          name: phase2l-cmorph-candidate-reservoir-34469303188
          path: work/reservoir
          repository: ${{ github.repository }}
          run-id: 34469303188
          github-token: ${{ github.token }}
      - name: Prove IMERG official polygon grid coverage
        run: |
          python scripts/phase2l_imerg_polygon_coverage_proof.py \
            --reservoir work/reservoir/phase2l_cmorph_candidate_reservoir.csv \
            --output-dir reports/historical/phase2l_imerg_polygon_coverage
      - name: Assert proof guardrails
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_imerg_polygon_coverage/phase2l_imerg_polygon_coverage.json',encoding='utf-8'))
          assert p['primary_subdivision_count']==45, p
          assert p['threshold_selected'] is False, p
          assert p['candidate_membership_changed'] is False, p
          assert p['environment_variables_used'] is False, p
          assert p['hard_negative_label'] is None, p
          assert p['validation_data_used'] is False, p
          assert p['retrospective_2026_used'] is False, p
          assert p['prospective_holdout_used'] is False, p
          assert p['risk_engine_allowed'] is False, p
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2l-imerg-polygon-coverage-proof-${{ github.run_id }}
          path: reports/historical/phase2l_imerg_polygon_coverage
          if-no-files-found: error
          retention-days: 90
