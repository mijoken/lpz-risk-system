name: LPZ Phase 2L-C CMORPH Matched Window Census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_C_CMORPH_CENSUS_TRIGGER.txt"

permissions:
  contents: read
  actions: read

jobs:
  monthly:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month:
          - 2023-01
          - 2023-02
          - 2023-03
          - 2023-04
          - 2023-05
          - 2023-06
          - 2023-07
          - 2023-08
          - 2023-09
          - 2023-10
          - 2023-11
          - 2023-12
          - 2024-01
          - 2024-02
          - 2024-03
          - 2024-04
          - 2024-05
          - 2024-06
          - 2024-07
          - 2024-08
          - 2024-09
          - 2024-10
          - 2024-11
          - 2024-12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download frozen Phase 2K positive baseline
        uses: actions/download-artifact@v4
        with:
          name: development-positive-environment-baseline-34423912911
          path: work/positive
          repository: ${{ github.repository }}
          run-id: 34423912911
          github-token: ${{ github.token }}
      - name: Build monthly matched-window census shard
        run: |
          python scripts/phase2l_cmorph_matched_window_monthly_census.py \
            --phase2k work/positive/development_positive_environment_baseline.json \
            --month "${{ matrix.month }}" \
            --output-dir "reports/historical/phase2l_cmorph_census/${{ matrix.month }}"
      - name: Assert monthly guardrails
        run: |
          python - <<'PY'
          import json,glob
          p=json.load(open(glob.glob('reports/historical/phase2l_cmorph_census/*/*.json')[0],encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_MONTHLY_MATCHED_WINDOW_CENSUS', p
          assert p['region_count']==45, p
          assert p['threshold_selected'] is False and p['candidate_generated'] is False
          assert p['hard_negative_label'] is None and p['source_fusion_used'] is False
          assert p['gsmap_used_for_discovery'] is False and p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False and p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2l-cmorph-census-${{ matrix.month }}
          path: reports/historical/phase2l_cmorph_census/${{ matrix.month }}
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: monthly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download frozen Phase 2K positive baseline
        uses: actions/download-artifact@v4
        with:
          name: development-positive-environment-baseline-34423912911
          path: work/positive
          repository: ${{ github.repository }}
          run-id: 34423912911
          github-token: ${{ github.token }}
      - name: Download all monthly shards
        uses: actions/download-artifact@v4
        with:
          pattern: phase2l-cmorph-census-*
          path: work/shards
          merge-multiple: false
      - name: Merge complete census and map Positive positions
        run: |
          python scripts/phase2l_merge_cmorph_matched_window_census.py \
            --shards-dir work/shards \
            --phase2k work/positive/development_positive_environment_baseline.json \
            --output-dir reports/historical/phase2l_cmorph_matched_window_census
      - name: Assert final guardrails
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_cmorph_matched_window_census/phase2l_cmorph_matched_window_census_report.json',encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_731D_X_45_REGION_CMORPH_MATCHED_WINDOW_CENSUS', p
          assert p['region_day_count']==32895 and p['positive_episode_count']==65, p
          assert p['threshold_selected'] is False and p['candidate_generated'] is False
          assert p['hard_negative_label'] is None and p['source_fusion_used'] is False
          assert p['gsmap_used_for_discovery'] is False and p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False and p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-cmorph-matched-window-census-${{ github.run_id }}
          path: reports/historical/phase2l_cmorph_matched_window_census
          if-no-files-found: error
          retention-days: 90
