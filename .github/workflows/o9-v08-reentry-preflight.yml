name: LPZ O9 IMERG Final V08 Re-entry Preflight

on:
  workflow_dispatch:
    inputs:
      live_v08_probe:
        description: "Run metadata-only NASA Earthdata V08 availability probe"
        required: true
        default: false
        type: boolean
  # One-time production bootstrap proof. Removed immediately after this run.
  push:
    branches: [main]
    paths:
      - ".github/workflows/o9-v08-reentry-preflight.yml"

permissions:
  contents: read

concurrency:
  group: lpz-o9-v08-reentry-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run O9 A/B/C safety tests
        run: |
          python -m pytest -q \
            tests/test_o9_v08_reentry_harness.py \
            tests/test_imerg_final_versioned.py \
            tests/test_o9_v08_required_coverage_gate.py

      - name: Optional metadata-only Final V08 availability probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_v08_probe }}
        shell: bash
        run: |
          mkdir -p reports/o9 research/o9/reentry
          set +e
          python scripts/o9_v08_availability_probe.py \
            --output reports/o9/o9_a_v08_availability_probe.json
          rc=$?
          set -e
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          src=Path('reports/o9/o9_a_v08_availability_probe.json')
          p=json.loads(src.read_text(encoding='utf-8'))
          print('O9-A live probe gate:', p['gate'])
          if p['gate']=='PASS_O9_A_V08_OFFICIAL_FINAL_AVAILABILITY':
              dst=Path('research/o9/reentry/o9_a_v08_availability.json')
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src,dst)
          PY
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi

      - name: Evaluate O9 re-entry state machine
        run: |
          mkdir -p reports/o9 research/o9/reentry
          python scripts/o9_v08_reentry_harness.py \
            --repo-root . \
            --evidence-dir research/o9/reentry \
            --output reports/o9/o9_v08_reentry_state.json
          python - <<'PY'
          import json
          p=json.load(open('reports/o9/o9_v08_reentry_state.json',encoding='utf-8'))
          assert not p['state'].startswith('BLOCKED_'), p
          assert p['risk_engine_allowed'] is False, p
          assert p['public_risk_release_allowed'] is False, p
          print('O9 preflight state:',p['state'])
          print('Next action:',p.get('next_action'))
          PY

      - name: Write summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## O9 IMERG Final V08 Re-entry Preflight')
          p=Path('reports/o9/o9_v08_reentry_state.json')
          if not p.exists():
              print('- State report not produced.')
              raise SystemExit(0)
          r=json.loads(p.read_text(encoding='utf-8'))
          print(f"- State: **{r['state']}**")
          print(f"- Next action: **{r.get('next_action')}**")
          print(f"- 2025 ERA5 may be opened: **{r['era5_2025_may_be_opened']}**")
          print(f"- Confirmatory run may execute: **{r['confirmatory_run_may_execute']}**")
          print('- Risk Engine: **LOCKED**')
          PY

      - name: Upload compact O9 preflight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: o9-v08-reentry-preflight-${{ github.run_id }}
          path: reports/o9/
          if-no-files-found: warn
          retention-days: 30
