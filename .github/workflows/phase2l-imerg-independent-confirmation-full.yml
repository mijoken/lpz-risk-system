name: LPZ Phase 2L-C IMERG Independent Confirmation Full

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_C_IMERG_CONFIRMATION_FULL_TRIGGER.txt"

permissions:
  contents: read
  actions: read

jobs:
  monthly:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month:
          - 2023-01
          - 2023-02
          - 2023-03
          - 2023-04
          - 2023-05
          - 2023-06
          - 2023-07
          - 2023-08
          - 2023-09
          - 2023-10
          - 2023-11
          - 2023-12
          - 2024-01
          - 2024-02
          - 2024-03
          - 2024-04
          - 2024-05
          - 2024-06
          - 2024-07
          - 2024-08
          - 2024-09
          - 2024-10
          - 2024-11
          - 2024-12
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify Earthdata secrets
        run: |
          set -euo pipefail
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Download frozen CMORPH candidate reservoir
        uses: actions/download-artifact@v4
        with:
          name: phase2l-cmorph-candidate-reservoir-34469303188
          path: work/reservoir
          repository: ${{ github.repository }}
          run-id: 34469303188
          github-token: ${{ github.token }}
      - name: Confirm monthly frozen candidates with IMERG
        run: |
          python scripts/phase2l_imerg_independent_confirmation_month.py \
            --reservoir work/reservoir/phase2l_cmorph_candidate_reservoir.csv \
            --month "${{ matrix.month }}" \
            --output-dir "reports/historical/phase2l_imerg_confirmation/${{ matrix.month }}"
      - name: Assert monthly guardrails
        run: |
          python - <<'PY'
          import glob,json
          p=json.load(open(glob.glob('reports/historical/phase2l_imerg_confirmation/*/*.json')[0],encoding='utf-8'))
          assert p['gate']=='PASS_IMERG_MONTH_CONFIRMATION', p
          assert p['candidate_region_day_count']==p['confirmed_region_day_count']
          assert p['cmorph_selected_candidates'] is True
          assert p['imerg_used_for_candidate_selection'] is False
          assert p['source_fusion_used'] is False
          assert p['hard_negative_label'] is None
          assert p['environment_variables_used'] is False
          assert p['gsmap_used_for_discovery'] is False
          assert p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False
          assert p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2l-imerg-confirmation-${{ matrix.month }}
          path: reports/historical/phase2l_imerg_confirmation/${{ matrix.month }}
          if-no-files-found: error
          retention-days: 90

  merge:
    needs: monthly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Download monthly confirmation shards
        uses: actions/download-artifact@v4
        with:
          pattern: phase2l-imerg-confirmation-*
          path: work/shards
          merge-multiple: false
      - name: Merge and audit source-native confirmation
        run: |
          python scripts/phase2l_merge_imerg_independent_confirmation.py \
            --shards-dir work/shards \
            --output-dir reports/historical/phase2l_imerg_confirmation_full
      - name: Assert final guardrails
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_imerg_confirmation_full/phase2l_imerg_independent_confirmation_full.json',encoding='utf-8'))
          assert p['gate']=='PASS_COMPLETE_IMERG_INDEPENDENT_CONFIRMATION_5943_REGION_DAYS', p
          assert p['confirmed_region_day_count']==5943
          assert p['unique_utc_day_count']==449
          assert p['candidate_membership_changed_by_imerg'] is False
          assert p['source_fusion_used'] is False
          assert p['hard_negative_label'] is None
          assert p['environment_variables_used'] is False
          assert p['gsmap_used_for_discovery'] is False
          assert p['validation_data_used'] is False
          assert p['retrospective_2026_used'] is False
          assert p['prospective_holdout_used'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-imerg-independent-confirmation-full-${{ github.run_id }}
          path: reports/historical/phase2l_imerg_confirmation_full
          if-no-files-found: error
          retention-days: 90
