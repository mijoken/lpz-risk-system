name: LPZ Public Production Cycle (O6)

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run four times per hour; exact start can drift a few minutes.
    - cron: "2,17,32,47 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-pages-deploy.yml"
      - "config/data_sources.json"
      - "research/phase2/phase2l_k2_v07_boundary_v08_deferred_validation_freeze_20260912.json"
      - "scripts/build_public_operational_source_health.py"
      - "scripts/build_public_rain_overlay.py"
      - "scripts/build_public_web_data.py"
      - "scripts/publish_f4_archived_research_summary.py"
      - "tests/test_publish_f4_archived_research_summary.py"
      - "scripts/acquisition_probe.py"
      - "src/**"
      - "tests/test_public_web.py"
      - "tests/test_public_rain_overlay.py"
      - "web/**"

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: lpz-public-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8"

      - name: Run public contract and rain-overlay tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest \
            tests/test_public_web.py \
            tests/test_public_rain_overlay.py \
            tests/test_publish_f4_archived_research_summary.py \
            -q

      - name: Check archived F4 browser JavaScript syntax
        run: |
          node --check web/js/f4-archive.js

      - name: Build GitHub operational source health
        run: |
          python scripts/build_public_operational_source_health.py \
            --output reports/public/o6_source_health.json \
            --acquisition-output reports/public/o6_acquisition_probe.json

      - name: Escalate IMERG Final V08 detection once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/o9_v08_escalation_state.txt
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/public/o6_source_health.json").read_text(encoding="utf-8")
          )

          earth = report.get("earthdata_imerg_research_source") or {}
          summary = report.get("summary") or {}

          available = bool(
              earth.get("v8_available")
              or summary.get("imerg_final_v08_available_by_metadata_probe")
          )

          state = str(earth.get("imerg_final_v08_metadata", "UNKNOWN"))

          print("true" if available else "false")
          print(state)
          PY

          V08_AVAILABLE="$(sed -n '1p' /tmp/o9_v08_escalation_state.txt)"
          V08_STATE="$(sed -n '2p' /tmp/o9_v08_escalation_state.txt)"

          echo "IMERG Final V08 available: ${V08_AVAILABLE}"
          echo "IMERG Final V08 state: ${V08_STATE}"

          if [ "${V08_AVAILABLE}" != "true" ]; then
            echo "Final V08 remains pending; no escalation required."
            exit 0
          fi

          ISSUE_TITLE="[O9-A] IMERG Final V08 detected — manual re-entry review required"

          EXISTING="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state all \
              --search "\"${ISSUE_TITLE}\" in:title" \
              --json number,title \
              --jq 'length'
          )"

          if [ "${EXISTING}" != "0" ]; then
            echo "Escalation issue already exists; duplicate notification suppressed."
            exit 0
          fi

          cat > /tmp/o9_v08_issue_body.md <<'EOF'
          ## IMERG Final V08 availability detected

          The existing LPZ source-health monitor has detected metadata indicating that
          NASA IMERG Final V08 may now be available.

          **This issue is an escalation notice only.**

          No scientific re-entry stage has been automatically executed.

          The following remain locked until the frozen O9 procedure authorizes them:

          - O9-C full required-slot coverage proof
          - V08 Development / Validation rainfall reconstruction
          - 2025 ERA5 opening
          - frozen Primary confirmatory test
          - Risk Engine
          - public LPZ risk release

          Required next action:

          1. Review the source-health evidence.
          2. Manually run the O9 V08 re-entry preflight.
          3. Accept O9-A only if the official Final V08 metadata proof passes.
          4. Continue through the frozen O9 sequence without skipping gates.

          Do **not** manually create canonical O9-A PASS evidence from this issue alone.

          @mijoken
          EOF

          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${ISSUE_TITLE}" \
            --body-file /tmp/o9_v08_issue_body.md \
            --assignee mijoken

          echo "One-shot Final V08 escalation issue created."
      - name: Build settled JMA rain overlay
        run: |
          python scripts/build_public_rain_overlay.py \
            --output-dir web/data/rain \
            --settled-lag-minutes 15 \
            --frame-count 5 \
            --frame-spacing-minutes 15

      - name: Build and validate public JSON products
        run: |
          python scripts/build_public_web_data.py \
            --source-health-report reports/public/o6_source_health.json \
            --pipeline-state PASS \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}"

      - name: Assert production deploy surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("web")
          required = [
              root / "index.html",
              root / "f4-archive.html",
              root / "css" / "f4-archive.css",
              root / "js" / "f4-archive.js",
              root / "data" / "research" / "f4_archived_geographic_research.geojson",
              root / "data" / "reference_cities.json",
              root / "css" / "app.css",
              root / "js" / "app.js",
              root / "js" / "map.js",
              root / "assets" / "japan_primary_subdivisions.geojson",
              root / "data" / "system_status.json",
              root / "data" / "source_health.json",
              root / "data" / "latest.json",
              root / "data" / "rain" / "latest.json",
          ]
          missing = [str(p) for p in required if not p.is_file()]
          assert not missing, missing

          status = json.loads((root / "data" / "system_status.json").read_text(encoding="utf-8"))
          latest = json.loads((root / "data" / "latest.json").read_text(encoding="utf-8"))
          rain = json.loads((root / "data" / "rain" / "latest.json").read_text(encoding="utf-8"))

          assert status["scientific_release"]["risk_engine_allowed"] is False
          assert status["scientific_release"]["primary_confirmatory_test_run"] is False
          assert latest["release"]["risk_engine_allowed"] is False
          assert len(latest["regions"]) == 142
          assert all(row["risk"] is None for row in latest["regions"])
          assert all(row["display_state"] != "RISK_AVAILABLE" for row in latest["regions"])

          f4 = json.loads((root / "data" / "research" / "f4_archived_geographic_research.geojson").read_text(encoding="utf-8"))
          assert f4["type"] == "FeatureCollection"
          assert f4["product"] == "LPZ_F4_ARCHIVED_GEOGRAPHIC_RESEARCH"
          assert f4["source_run_id"] == "35564667965"
          assert f4["archived_research_only"] is True
          assert f4["risk_engine_allowed"] is False
          assert f4["lpz_forecast_generated"] is False
          assert f4["radar_coverage"] == "SELECTED_FIXED_MOSAIC_NOT_NATIONWIDE"
          assert f4["projected_object_count"] == 106
          assert f4["feature_count"] == 530 == len(f4["features"])

          assert rain["product"] == "LPZ_PUBLIC_RAIN_OVERLAY"
          assert rain["display_only"] is True
          assert rain["scientific_input_allowed"] is False
          for frame in rain.get("frames", []):
              image = root / frame["image_path"].removeprefix("data/")
              # image_path is relative to web/, not web/data/.
              image = root / frame["image_path"]
              assert image.is_file(), image

          print("O6 production deploy surface invariant: PASS")
          print(f"rain_status={rain['status']} frames={len(rain.get('frames', []))}")
          PY

      - name: Write workflow summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## LPZ Public Production Cycle")
          status_p = Path("web/data/system_status.json")
          rain_p = Path("web/data/rain/latest.json")
          source_p = Path("web/data/source_health.json")
          if status_p.exists():
              s=json.loads(status_p.read_text(encoding="utf-8"))
              print(f"- Pipeline: **{s['pipeline']['state']}**")
              print(f"- Scientific release: **{s['scientific_release']['state']}**")
              print(f"- Risk engine allowed: **{s['scientific_release']['risk_engine_allowed']}**")
          if source_p.exists():
              h=json.loads(source_p.read_text(encoding="utf-8"))
              print(f"- Live source health: **{h['overall_status']}**")
          if rain_p.exists():
              r=json.loads(rain_p.read_text(encoding="utf-8"))
              print(f"- Rain layer: **{r['status']}** ({len(r.get('frames', []))} frames)")
              if r.get("frames"):
                  print(f"- Latest rain frame: `{r['frames'][r['latest_index']]['valid_time_utc']}`")
          PY

      # Pages was enabled once in Settings > Pages > Source: GitHub Actions.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
