name: LPZ Public Pages Deploy (O5)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lpz-public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install O5 validation dependencies
        run: python -m pip install --upgrade "pytest>=8" "jsonschema>=4.23"

      - name: Run public web contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_public_web.py -q

      - name: Build safe O5 bootstrap source health
        run: |
          python scripts/build_public_deploy_bootstrap_source_health.py \
            --output reports/public/o5_bootstrap_source_health.json

      - name: Build and validate public JSON products
        run: |
          python scripts/build_public_web_data.py \
            --source-health-report reports/public/o5_bootstrap_source_health.json \
            --pipeline-state DEGRADED \
            --run-id "${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}"

      - name: Assert public deploy surface
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("web")
          required = [
              root / "index.html",
              root / "css" / "app.css",
              root / "js" / "app.js",
              root / "js" / "map.js",
              root / "assets" / "japan_primary_subdivisions.geojson",
              root / "data" / "system_status.json",
              root / "data" / "source_health.json",
              root / "data" / "latest.json",
          ]
          missing = [str(p) for p in required if not p.is_file()]
          assert not missing, missing

          status = json.loads((root / "data" / "system_status.json").read_text(encoding="utf-8"))
          latest = json.loads((root / "data" / "latest.json").read_text(encoding="utf-8"))
          assert status["scientific_release"]["risk_engine_allowed"] is False
          assert latest["release"]["risk_engine_allowed"] is False
          assert len(latest["regions"]) == 142
          assert all(row["risk"] is None for row in latest["regions"])
          assert all(row["display_state"] != "RISK_AVAILABLE" for row in latest["regions"])
          print("O5 deploy surface invariant: PASS")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
