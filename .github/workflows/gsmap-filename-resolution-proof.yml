name: LPZ GSMaP Filename Resolution Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gsmap-filename-resolution-proof.yml"

permissions:
  contents: read

env:
  GSMAP_FTP_USERNAME: ${{ secrets.GSMAP_FTP_USERNAME }}
  GSMAP_FTP_PASSWORD: ${{ secrets.GSMAP_FTP_PASSWORD }}
  EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
  EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Build frozen DEVELOPMENT plan
        run: |
          python scripts/build_historical_case_registry.py --config config/historical_case_sources.json --output reports/historical/historical_case_source_registry.json
          python scripts/build_positive_case_registry.py --source-audit reports/historical/historical_case_source_registry.json --config config/historical_case_sources.json --output reports/historical/positive_case_registry.json
          python scripts/build_positive_episode_registry.py --positive-registry reports/historical/positive_case_registry.json --policy config/historical_split_policy.json --output reports/historical/positive_episode_registry.json
          python scripts/build_development_rainfall_window_manifest.py --episode-registry reports/historical/positive_episode_registry.json --output reports/historical/development_rainfall_window_manifest.json
          python scripts/build_development_rainfall_production_plan.py --window-manifest reports/historical/development_rainfall_window_manifest.json --output reports/historical/development_rainfall_production_plan.json
          python scripts/build_development_rainfall_geometry.py --plan reports/historical/development_rainfall_production_plan.json --output reports/historical/development_primary_subdivision_geometry.geojson
      - name: Re-run previously failing GSMaP task
        run: |
          python scripts/reconstruct_development_rainfall_task.py \
            --plan reports/historical/development_rainfall_production_plan.json \
            --window-manifest reports/historical/development_rainfall_window_manifest.json \
            --geometry reports/historical/development_primary_subdivision_geometry.geojson \
            --task-id RAINPROD-c9f1cc1e35b591 \
            --output reports/historical/gsmap_filename_resolution_proof.json
      - name: Assert focused repair
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/gsmap_filename_resolution_proof.json',encoding='utf-8'))
          assert p['gate']=='PASS_TASK_REAL_PAYLOAD_RECONSTRUCTION', p
          assert p['source_id']=='GSMAP_STANDARD_V8_HISTORICAL', p
          assert p['gsmap_resolution_policy']=='LIVE_DIRECTORY_LISTING_TIMESTAMP_AND_PRODUCT_MATCH_NO_FABRICATED_REVISION_SUFFIX', p
          assert p['candidate_threshold_selected'] is False
          assert p['risk_engine_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsmap-filename-resolution-proof-${{ github.run_id }}
          path: reports/historical/gsmap_filename_resolution_proof.json
          if-no-files-found: error
          retention-days: 30
