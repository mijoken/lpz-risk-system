name: O8.1-D Branch Proof

on:
  push:
    branches: [o8-1-d-daily-consolidation-v2]
    paths:
      - ".github/workflows/o8-1-d-branch-proof.yml"
      - "scripts/consolidate_prospective_feature_bundles.py"
      - "tests/test_o8_1_daily_consolidation_v2.py"
      - ".github/workflows/prospective-daily-consolidation.yml"

permissions:
  contents: read
  actions: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_o8_1_daily_consolidation_v2.py
      - name: Download two proven O8.1-C production batches
        shell: bash
        run: |
          mkdir -p incoming/full/34747609351 incoming/full/34747798967
          gh run download 34747609351 --repo "$GITHUB_REPOSITORY" --name prospective-batch-34747609351 --dir incoming/full/34747609351
          gh run download 34747798967 --repo "$GITHUB_REPOSITORY" --name prospective-batch-34747798967 --dir incoming/full/34747798967
      - name: Consolidate real O8.1-C slots by collection clock
        run: |
          mkdir -p reports/prospective/o8_1_d
          python scripts/consolidate_prospective_feature_bundles.py \
            --input-root incoming/full \
            --date-utc 2026-09-13 \
            --output-gz reports/prospective/o8_1_d/2026-09-13.jsonl.gz \
            --manifest-output reports/prospective/o8_1_d/2026-09-13.manifest.json
      - name: Assert real-data proof
        run: |
          python - <<'PY'
          import gzip, json
          p=json.load(open('reports/prospective/o8_1_d/2026-09-13.manifest.json',encoding='utf-8'))
          assert p['canonical_slot_count'] == 96, p
          assert p['complete_slot_count'] == 8, p
          assert p['native_complete_slot_count'] == 2, p
          assert p['recovered_complete_slot_count'] == 6, p
          assert p['technical_incomplete_slot_count'] == 0, p
          assert p['explicit_gap_count'] == 88, p
          assert p['parse_error_count'] == 0, p
          assert p['risk_engine_allowed'] is False, p
          with gzip.open('reports/prospective/o8_1_d/2026-09-13.jsonl.gz','rt',encoding='utf-8') as fh:
              rows=[json.loads(line) for line in fh]
          assert len(rows) == 96
          assert [r['slot_index'] for r in rows] == list(range(96))
          complete=[r for r in rows if r['slot_state']=='COMPLETE']
          assert len(complete)==8
          print('PASS_PHASE2L_O8_1_D_REAL_DATA_BRANCH_PROOF')
          print(json.dumps({
            'complete': p['complete_slot_count'],
            'native': p['native_complete_slot_count'],
            'recovered': p['recovered_complete_slot_count'],
            'explicit_gaps': p['explicit_gap_count'],
          }, indent=2))
          PY
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: o8-1-d-branch-proof-${{ github.run_id }}
          path: reports/prospective/o8_1_d/
          if-no-files-found: error
          retention-days: 3
