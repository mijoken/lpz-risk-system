name: O8.1-E Branch Proof

on:
  push:
    branches: [o8-1-e-consecutive-day-observer]
    paths:
      - ".github/workflows/o8-1-e-branch-proof.yml"
      - ".github/workflows/o8-1-e-consecutive-day-observer.yml"
      - "scripts/observe_consecutive_daily_completeness.py"
      - "tests/test_o8_1_consecutive_day_observer.py"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_o8_1_consecutive_day_observer.py
      - name: Observe current repository state without false-positive closure
        run: |
          mkdir -p reports/operations/o8_1_e
          python scripts/observe_consecutive_daily_completeness.py \
            --repo-root . \
            --as-of-utc 2026-09-13T11:40:00Z \
            --required-days 2 \
            --history-days 5 \
            --output reports/operations/o8_1_e/current_repo.json
      - name: Assert current state is correctly waiting
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/operations/o8_1_e/current_repo.json',encoding='utf-8'))
          assert p['phase'] == '2L-O8.1-E-consecutive-day-completeness-observer', p
          assert p['latest_expected_finalized_date_utc'] == '2026-09-12', p
          assert p['gate_passed'] is False, p
          assert p['current_consecutive_complete_day_streak'] == 0, p
          assert p['required_days'][0]['state'] == 'WAIT_NONCANONICAL_OR_LEGACY', p
          assert p['required_days'][1]['state'] == 'WAIT_MISSING', p
          assert p['windows_task_may_be_disabled'] is False, p
          assert p['risk_engine_allowed'] is False, p
          print('PASS_PHASE2L_O8_1_E_CURRENT_REPOSITORY_WAIT_STATE')
          print(json.dumps({
              'state': p['state'],
              'streak': p['current_consecutive_complete_day_streak'],
              'latest_day': p['required_days'][0]['state'],
              'previous_day': p['required_days'][1]['state'],
          }, indent=2))
          PY
