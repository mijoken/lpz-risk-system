name: LPZ Historical Rainfall 3H Polygon Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-hour-polygon-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GSMAP_FTP_USERNAME: ${{ secrets.GSMAP_FTP_USERNAME }}
      GSMAP_FTP_PASSWORD: ${{ secrets.GSMAP_FTP_PASSWORD }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GSMAP_FTP_USERNAME:-}"
          test -n "${GSMAP_FTP_PASSWORD:-}"
          test -n "${EARTHDATA_USERNAME:-}"
          test -n "${EARTHDATA_PASSWORD:-}"
      - name: Run real 3-hour accumulation and official polygon pilot
        run: python scripts/historical_rainfall_3h_polygon_pilot.py --output reports/historical/historical_rainfall_3h_polygon_pilot.json
      - name: Assert anti-leakage and source-native gates
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/historical_rainfall_3h_polygon_pilot.json',encoding='utf-8'))
          assert p['gate']=='PASS_REAL_3H_ACCUMULATION_AND_OFFICIAL_POLYGON_MASKING', p
          assert p['split']=='DEVELOPMENT'
          assert p['provider_comparison_semantics']=='SIDE_BY_SIDE_ONLY_NO_AVERAGING'
          assert p['candidate_threshold_selected'] is False
          assert p['hard_negative_label'] is None
          assert p['risk_score'] is None
          assert p['raw_payloads_persisted'] is False
          assert p['risk_engine_allowed'] is False
          providers=p['providers']
          assert len(providers)==2
          counts={x['window']['source_id']:x['window']['native_field_count'] for x in providers}
          assert counts['GSMAP_STANDARD_V8_HISTORICAL']==3, counts
          assert counts['NASA_IMERG_FINAL_V07']==6, counts
          for x in providers:
              assert x['window']['accumulation_seconds']==10800
              assert x['subdivision']['accumulation_seconds']==10800
              assert x['subdivision']['candidate_threshold_selected'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-rainfall-3h-polygon-pilot-${{ github.run_id }}
          path: reports/historical/historical_rainfall_3h_polygon_pilot.json
          if-no-files-found: error
          retention-days: 30
