name: LPZ Prospective Daily Consolidation v2

on:
  workflow_dispatch:
    inputs:
      date_utc:
        description: "UTC date to consolidate (YYYY-MM-DD); empty = previous UTC day"
        required: false
        default: ""
  schedule:
    # By 02:30 UTC the previous day's 23:45 slot is outside the audited 120m
    # recovery horizon. 08:30 is a redundant wake-up for GitHub schedule delay/skip.
    - cron: "30 2,8 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: lpz-prospective-daily-consolidation-v2
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve target UTC date
        id: date
        shell: bash
        run: |
          TARGET="${{ inputs.date_utc }}"
          if [ -z "$TARGET" ]; then TARGET=$(date -u -d 'yesterday' +%F); fi
          python - <<PY
          from datetime import datetime
          datetime.strptime("$TARGET", "%Y-%m-%d")
          PY
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target UTC date: $TARGET"

      - name: Discover completed collector runs that could contain target-day slots
        shell: bash
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}
        run: |
          mkdir -p incoming/indexes incoming/full
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow prospective-feature-collector.yml \
            --branch main \
            --limit 400 \
            --json databaseId,createdAt,conclusion,status \
            > /tmp/o81d-runs.json
          python - <<'PY' > /tmp/o81d-candidate-run-ids.txt
          import json, os
          from datetime import datetime, timedelta, timezone

          target=datetime.strptime(os.environ['TARGET_DATE'], '%Y-%m-%d').replace(tzinfo=timezone.utc)
          end=target + timedelta(days=1, hours=3)
          rows=json.load(open('/tmp/o81d-runs.json',encoding='utf-8'))
          for row in rows:
              # O8.1-C uploads its full batch and lightweight index with if: always().
              # A failed collector run may therefore contain the only auditable
              # TECHNICAL_INCOMPLETE representation of a scientific slot. Excluding
              # it here would incorrectly turn that state into EXPLICIT_GAP.
              if row.get('status') != 'completed':
                  continue
              created=datetime.fromisoformat(str(row['createdAt']).replace('Z','+00:00')).astimezone(timezone.utc)
              if target <= created <= end:
                  print(row['databaseId'])
          PY
          echo "Candidate completed collector runs: $(wc -l < /tmp/o81d-candidate-run-ids.txt)"

      - name: Download lightweight O8.1-C batch indexes
        shell: bash
        run: |
          downloaded=0
          while read -r rid; do
            [ -z "$rid" ] && continue
            mkdir -p "incoming/indexes/$rid"
            if gh run download "$rid" \
              --repo "$GITHUB_REPOSITORY" \
              --name "prospective-batch-index-$rid" \
              --dir "incoming/indexes/$rid" >/dev/null 2>&1; then
              downloaded=$((downloaded+1))
            fi
          done < /tmp/o81d-candidate-run-ids.txt
          echo "O8.1-C indexes downloaded: $downloaded"

      - name: Select runs by collection_slot_utc and download full batches
        shell: bash
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}
        run: |
          python - <<'PY' > /tmp/o81d-target-run-ids.txt
          import json, os
          from pathlib import Path

          target=os.environ['TARGET_DATE']
          ids=set()
          for path in Path('incoming/indexes').rglob('batch_manifest.json'):
              try:
                  p=json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if any(str(row.get('collection_slot_utc',''))[:10] == target for row in (p.get('slot_results') or []) if isinstance(row,dict)):
                  rid=str(p.get('run_id') or '')
                  if rid:
                      ids.add(rid)
          for rid in sorted(ids, key=lambda x: int(x) if x.isdigit() else x):
              print(rid)
          PY

          downloaded=0
          while read -r rid; do
            [ -z "$rid" ] && continue
            mkdir -p "incoming/full/$rid"
            gh run download "$rid" \
              --repo "$GITHUB_REPOSITORY" \
              --name "prospective-batch-$rid" \
              --dir "incoming/full/$rid"
            downloaded=$((downloaded+1))
          done < /tmp/o81d-target-run-ids.txt
          echo "Full batches selected by collection_slot_utc: $downloaded"

      - name: Build canonical 96-slot daily archive
        shell: bash
        run: |
          D="${{ steps.date.outputs.target }}"
          Y=$(echo "$D" | cut -d- -f1)
          M=$(echo "$D" | cut -d- -f2)
          mkdir -p "research/prospective/$Y/$M"
          python scripts/consolidate_prospective_feature_bundles.py \
            --input-root incoming/full \
            --date-utc "$D" \
            --output-gz "research/prospective/$Y/$M/$D.jsonl.gz" \
            --manifest-output "research/prospective/$Y/$M/$D.manifest.json"

      - name: Assert O8.1-D canonical contract
        shell: bash
        run: |
          D="${{ steps.date.outputs.target }}"
          Y=$(echo "$D" | cut -d- -f1)
          M=$(echo "$D" | cut -d- -f2)
          MANIFEST="research/prospective/$Y/$M/$D.manifest.json"
          python - "$MANIFEST" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['phase'] == '2L-O8.1-D-daily-consolidation-v2', p
          assert p['scientific_clock'] == 'collection_slot_utc', p
          assert p['canonical_slot_count'] == 96, p
          assert p['complete_slot_count'] + p['technical_incomplete_slot_count'] + p['explicit_gap_count'] == 96, p
          assert p['risk_engine_allowed'] is False, p
          assert p['risk_score'] is None and p['lpz_classification'] is None, p
          assert p['raw_radar_archived'] is False and p['raw_grib_archived'] is False, p
          assert p['parse_error_count'] == 0, p
          print('PASS_PHASE2L_O8_1_D_CANONICAL_DAILY_CONTRACT')
          print(json.dumps({
              'quality': p['canonical_day_quality'],
              'complete': p['complete_slot_count'],
              'native': p['native_complete_slot_count'],
              'recovered': p['recovered_complete_slot_count'],
              'technical_incomplete': p['technical_incomplete_slot_count'],
              'explicit_gaps': p['explicit_gap_count'],
              'duplicates': p['duplicate_slot_count'],
          }, indent=2))
          PY

      - name: Commit canonical daily archive to GitHub source of truth
        shell: bash
        run: |
          D="${{ steps.date.outputs.target }}"
          Y=$(echo "$D" | cut -d- -f1)
          M=$(echo "$D" | cut -d- -f2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "research/prospective/$Y/$M/$D.jsonl.gz" "research/prospective/$Y/$M/$D.manifest.json"
          if git diff --cached --quiet; then
            echo "Canonical daily archive unchanged."
          else
            git commit -m "archive: canonical prospective LPZ slots $D"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
