name: LPZ Prospective Daily Consolidation

on:
  workflow_dispatch:
    inputs:
      date_utc:
        description: "UTC date to consolidate (YYYY-MM-DD); empty = previous UTC day"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: lpz-prospective-daily-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target UTC date
        id: date
        shell: bash
        run: |
          TARGET="${{ inputs.date_utc }}"
          if [ -z "$TARGET" ]; then TARGET=$(date -u -d 'yesterday' +%F); fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target UTC date: $TARGET"

      - name: Download collector artifacts for target day
        shell: bash
        run: |
          mkdir -p incoming
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow prospective-feature-collector.yml \
            --limit 200 \
            --json databaseId,createdAt,conclusion,event > /tmp/runs.json
          python - <<'PY' > /tmp/run_ids.txt
          import json, os
          target=os.environ['TARGET_DATE']
          rows=json.load(open('/tmp/runs.json',encoding='utf-8'))
          for r in rows:
              if str(r.get('createdAt',''))[:10] == target and r.get('conclusion') == 'success':
                  print(r['databaseId'])
          PY
          count=0
          while read -r rid; do
            [ -z "$rid" ] && continue
            mkdir -p "incoming/$rid"
            gh run download "$rid" \
              --repo "$GITHUB_REPOSITORY" \
              --name "prospective-feature-bundle-$rid" \
              --dir "incoming/$rid" || true
            count=$((count+1))
          done < /tmp/run_ids.txt
          echo "Collector runs selected: $count"
        env:
          TARGET_DATE: ${{ steps.date.outputs.target }}

      - name: Consolidate immutable daily archive
        run: |
          Y=$(echo "${{ steps.date.outputs.target }}" | cut -d- -f1)
          M=$(echo "${{ steps.date.outputs.target }}" | cut -d- -f2)
          D="${{ steps.date.outputs.target }}"
          mkdir -p "research/prospective/$Y/$M"
          python scripts/consolidate_prospective_feature_bundles.py \
            --input-root incoming \
            --date-utc "$D" \
            --output-gz "research/prospective/$Y/$M/$D.jsonl.gz" \
            --manifest-output "research/prospective/$Y/$M/$D.manifest.json"

      - name: Commit daily archive to GitHub source of truth
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add research/prospective/
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "archive: prospective LPZ features ${{ steps.date.outputs.target }}"
            git push origin HEAD:main
          fi
