name: LPZ GitHub-only Production Closure Audit (O8 Legacy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Legacy audit notice
        run: |
          echo "Legacy O8 closure criteria are superseded by O8.1-F."
          echo "The retired O8 assumption that GitHub cron must itself fire ~96 times/day is no longer authoritative."
          echo "Canonical cutover gate: .github/workflows/o8-1-f-final-cutover-audit.yml"
          echo "Do not use this legacy workflow to decide whether to disable LPZ-Prospective-Collector-15min."
