name: LPZ GSMaP v8 NetCDF 24h Sequential FTP Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_GSMAP_V8_NETCDF_24H_TRIGGER.txt"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSMAP_FTP_USERNAME: ${{ secrets.GSMAP_FTP_USERNAME }}
      GSMAP_FTP_PASSWORD: ${{ secrets.GSMAP_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Verify GSMaP credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GSMAP_FTP_USERNAME:-}"
          test -n "${GSMAP_FTP_PASSWORD:-}"
      - name: Acquire one full Development-era day sequentially
        run: |
          python scripts/gsmap_v8_netcdf_24h_sequential_proof.py \
            --date 2023-07-10 \
            --pause-seconds 1.0 \
            --output reports/historical/phase2l_gsmap_v8_netcdf_24h_sequential_proof.json
      - name: Assert conservative-access research guardrails
        if: success()
        run: |
          python - <<'PY'
          import json
          p=json.load(open('reports/historical/phase2l_gsmap_v8_netcdf_24h_sequential_proof.json',encoding='utf-8'))
          assert p['gate']=='PASS_GSMAP_V8_NETCDF_24H_SEQUENTIAL_FTP_PROOF', p
          assert p['completed_file_count']==24, p
          assert p['single_control_session'] is True, p
          assert p['parallel_connections']==1, p
          assert p['automatic_reconnect'] is False, p
          assert p['retry_count_per_file']==0, p
          assert p['broad_traversal_used'] is False, p
          assert p['raw_payload_persisted'] is False, p
          assert p['threshold_selected'] is False, p
          assert p['candidate_generated'] is False, p
          assert p['hard_negative_label'] is None, p
          assert p['source_fusion_used'] is False, p
          assert p['validation_data_used'] is False, p
          assert p['retrospective_2026_used'] is False, p
          assert p['prospective_holdout_used'] is False, p
          assert p['risk_engine_allowed'] is False, p
          assert all(r['status']=='PASS' for r in p['files']), p['files']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2l-gsmap-v8-netcdf-24h-${{ github.run_id }}
          path: reports/historical/phase2l_gsmap_v8_netcdf_24h_sequential_proof.json
          if-no-files-found: error
          retention-days: 90
