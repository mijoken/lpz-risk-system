name: LPZ Phase 2L CMORPH S3 Prefix Proof

on:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_CMORPH_S3_PREFIX_TRIGGER.txt"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List bounded CMORPH daily hierarchy
        run: |
          set -euo pipefail
          mkdir -p reports/historical
          {
            echo '=== daily root ==='
            aws s3api list-objects-v2 --no-sign-request \
              --bucket noaa-cdr-precip-cmorph-pds \
              --prefix 'data/daily/' --delimiter '/' --max-keys 50 --output json
            echo '=== 2023 prefix ==='
            aws s3api list-objects-v2 --no-sign-request \
              --bucket noaa-cdr-precip-cmorph-pds \
              --prefix 'data/daily/2023' --delimiter '/' --max-keys 20 --output json
          } | tee reports/historical/phase2l_cmorph_s3_daily_hierarchy.json.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-cmorph-s3-prefix-${{ github.run_id }}
          path: reports/historical/phase2l_cmorph_s3_daily_hierarchy.json.txt
          if-no-files-found: error
          retention-days: 30
