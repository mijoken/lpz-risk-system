name: LPZ Phase 2L CMORPH S3 Prefix Proof

on:
  push:
    branches: [main]
    paths:
      - "research/phase2/PHASE2L_CMORPH_S3_PREFIX_TRIGGER.txt"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List CMORPH data root only
        run: |
          set -euo pipefail
          mkdir -p reports/historical
          aws s3 ls --no-sign-request s3://noaa-cdr-precip-cmorph-pds/data/ | tee reports/historical/phase2l_cmorph_s3_data_root.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase2l-cmorph-s3-prefix-${{ github.run_id }}
          path: reports/historical/phase2l_cmorph_s3_data_root.txt
          if-no-files-found: error
          retention-days: 30
