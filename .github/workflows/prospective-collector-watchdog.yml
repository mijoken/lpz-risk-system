name: LPZ Prospective Collector Watchdog

on:
  workflow_dispatch:
  workflow_run:
    # Primary GitHub-only continuity relay.
    #
    # Every collector completion arms a delayed liveness check. A newer
    # collector completion replaces the older timer through the workflow_run
    # concurrency group below. If no newer collector succeeds before the timer
    # expires, the watchdog dispatches the collector explicitly.
    workflows: ["LPZ Prospective Self-Healing Batch Collector"]
    types: [completed]
    branches: [main]
  schedule:
    # Low-frequency rescue only. GitHub schedule is not the scientific clock
    # and is not trusted as the primary continuity mechanism.
    - cron: "41 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  # Keep only the newest timer for each trigger class. In particular, a newer
  # collector completion resets the workflow_run continuity timer.
  group: lpz-prospective-collector-watchdog-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Arm post-collector continuity timer
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail

          echo "Collector completed."
          echo "Arming 50-minute GitHub-only continuity timer."
          echo "A newer collector completion will cancel and replace this timer."

          sleep 3000

      - name: Inspect collector liveness
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          STATUSES = ("queued", "in_progress", "waiting", "pending", "requested")
          THRESHOLD = 25.0
          repo = os.environ["GITHUB_REPOSITORY"]
          workflow = "prospective-feature-collector.yml"
          now = datetime.now(timezone.utc)

          def fetch(status=None):
              url = f"/repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=100"
              if status:
                  url += f"&status={status}"
              completed = subprocess.run(
                  ["gh", "api", "-H", "Accept: application/vnd.github+json", url],
                  capture_output=True, text=True, timeout=20, check=True,
              )
              return json.loads(completed.stdout)

          def parse_time(value):
              if not isinstance(value, str):
                  raise ValueError("INVALID_TIMESTAMP")
              dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if dt.tzinfo is None:
                  raise ValueError("TIMEZONE_REQUIRED")
              dt = dt.astimezone(timezone.utc)
              if (dt - now).total_seconds() > 120:
                  raise ValueError("FUTURE_TIMESTAMP")
              return dt

          def validate(payload, label, complete=False):
              if not isinstance(payload, dict):
                  raise ValueError("INVALID_RESPONSE")
              total = payload.get("total_count")
              rows = payload.get("workflow_runs")
              if type(total) is not int or total < 0 or not isinstance(rows, list):
                  raise ValueError("INVALID_PAGE_SHAPE")
              if total < len(rows) or (complete and total != len(rows)):
                  raise ValueError("INCOMPLETE_OR_INCONSISTENT_PAGE")
              if total > 0 and not rows:
                  raise ValueError("EMPTY_NONZERO_PAGE")
              for row in rows:
                  if not isinstance(row, dict) or type(row.get("id")) is not int:
                      raise ValueError("INVALID_RUN")
                  if not isinstance(row.get("status"), str):
                      raise ValueError("INVALID_STATUS")
                  parse_time(row.get("created_at"))
                  if label != "recent" and row["status"] != label:
                      raise ValueError("STATUS_MISMATCH")
              return rows

          dispatch = False
          reason = "FAIL_CLOSED"
          active_count = None
          latest_age = None
          latest_id = None
          try:
              recent = validate(fetch(), "recent")
              active_ids = set()
              for status in STATUSES:
                  for row in validate(fetch(status), status, complete=True):
                      active_ids.add(row["id"])
              active_count = len(active_ids)
              if active_ids:
                  reason = "COLLECTOR_ALREADY_ACTIVE"
              elif not recent:
                  reason = "NO_RUN_HISTORY_MANUAL_REVIEW"
              else:
                  latest = max(recent, key=lambda row: parse_time(row["created_at"]))
                  latest_id = latest["id"]
                  latest_age = (now - parse_time(latest["created_at"])).total_seconds() / 60
                  if latest_age < THRESHOLD:
                      reason = "RECENT_COLLECTOR_START"
                  else:
                      dispatch = True
                      reason = "NO_ACTIVE_RUN_AND_START_STALE"
          except Exception as exc:
              dispatch = False
              reason = "FAIL_CLOSED:" + type(exc).__name__ + ":" + str(exc)[:180]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"dispatch={'true' if dispatch else 'false'}\n")
              f.write(f"reason={reason}\n")
              f.write(f"latest_start_age_minutes={latest_age:.2f}\n" if latest_age is not None else "latest_start_age_minutes=NA\n")

          print(json.dumps({
              "decision": "WOULD_DISPATCH" if dispatch else "NO_DISPATCH",
              "reason": reason,
              "active_run_count": active_count,
              "latest_run_id": latest_id,
              "latest_start_age_minutes": latest_age,
              "threshold_minutes": THRESHOLD,
              "risk_engine_allowed": False,
          }, ensure_ascii=False))
          PY

      - name: Dispatch collector when stale
        if: steps.decision.outputs.dispatch == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Collector wake-up required."
          echo "Reason: ${{ steps.decision.outputs.reason }}"
          echo "Latest start age: ${{ steps.decision.outputs.latest_start_age_minutes }} min"

          gh workflow run prospective-feature-collector.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          echo "Collector workflow_dispatch submitted."

      - name: Record healthy no-op
        if: steps.decision.outputs.dispatch != 'true'
        shell: bash
        run: |
          echo "No collector dispatch required."
          echo "Reason: ${{ steps.decision.outputs.reason }}"
          echo "Latest start age: ${{ steps.decision.outputs.latest_start_age_minutes }} min"
