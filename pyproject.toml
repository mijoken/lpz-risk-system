[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lpz-risk-system"
version = "0.1.0"
description = "Explainable real-time LPZ risk monitoring and research system"
requires-python = ">=3.11"
dependencies = [
  "cdsapi>=0.7.7",
  "earthaccess>=0.15.0",
  "eccodes>=2.43.0",
  "h5py>=3.11",
  "netCDF4>=1.7",
  "numpy>=1.26",
  "Pillow>=10.0",
  "pyshp>=2.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
